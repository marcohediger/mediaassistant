{% extends "base.html" %}
{% block content %}
<h1>{{ t.tools.title }}</h1>

<div class="settings-section" id="section-sidecar-tags">
    <div class="section-header">
        <div class="section-title">
            <h2>{{ t.tools.tags_title }}</h2>
            <span class="section-desc">{{ t.tools.tags_desc }}</span>
        </div>
    </div>
    <div class="section-body">
        <p class="section-note" style="margin-bottom: 1rem;">
            {{ t.tools.tags_hint }} <code>{{ library_path }}</code>
        </p>

        <div class="form-group">
            <label for="tag_pattern">{{ t.tools.pattern }}</label>
            <input type="text" id="tag_pattern" value="^\d{4}-\d{2}-\d{2}$" spellcheck="false" oninput="sidecarInvalidate()">
            <small>{{ t.tools.pattern_hint }}</small>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 0.5rem;">
            <label class="switch-inline">
                <input type="checkbox" id="do_sidecars" checked onchange="sidecarInvalidate()">
                <span class="switch-slider-sm"></span>
                <span>{{ t.tools.scope_sidecars }}</span>
            </label>
            <label class="switch-inline">
                <input type="checkbox" id="do_immich" onchange="sidecarInvalidate()">
                <span class="switch-slider-sm"></span>
                <span>{{ t.tools.scope_immich }}</span>
            </label>
        </div>
        <label class="switch-inline" id="per_asset_row" style="margin-left: 2.5rem;">
            <input type="checkbox" id="do_per_asset" onchange="sidecarInvalidate()">
            <span class="switch-slider-sm"></span>
            <span>{{ t.tools.per_asset }}</span>
        </label>
        <label class="switch-inline" id="also_delete_row" style="margin-left: 5rem; margin-bottom: 0.5rem;">
            <input type="checkbox" id="do_also_delete" onchange="sidecarInvalidate()">
            <span class="switch-slider-sm"></span>
            <span>{{ t.tools.also_delete }}</span>
        </label>
        <p class="section-note" style="margin-bottom: 1rem;">{{ t.tools.scope_hint }}</p>

        <div class="inbox-actions" style="align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('^\\d{4}-\\d{2}-\\d{2}$')">{{ t.tools.preset_date }}</button>
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('^\\d{2}\\.\\d{2}\\.\\d{4}$')">{{ t.tools.preset_date_dots }}</button>
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('^\\d{4}$')">{{ t.tools.preset_year }}</button>
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('^(\\d{4}-\\d{2}-\\d{2}|\\d{2}\\.\\d{2}\\.\\d{4}|\\d{4})$')">{{ t.tools.preset_all_dates }}</button>
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('^(\\d+|\\d{4}-\\d{2}-\\d{2}|\\d{2}\\.\\d{2}\\.\\d{4})$')">{{ t.tools.preset_numeric }}</button>
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('(?=.*[A-Za-z])(?=.*[\\u4e00-\\u9fff])|(?=.*[\\u0370-\\u03ff])(?=.*[\\u0400-\\u04ff])')">{{ t.tools.preset_mixed }}</button>
            <button type="button" class="btn btn-small btn-secondary" onclick="sidecarPreset('^[\\W\\d_]+$')">{{ t.tools.preset_noletters }}</button>
        </div>

        <div class="inbox-actions" style="align-items: center; gap: 0.75rem;">
            <button type="button" class="btn btn-small btn-primary" id="btn_scan" onclick="sidecarRun('scan')">{{ t.tools.scan }}</button>
            <button type="button" class="btn btn-small btn-danger" id="btn_remove" disabled onclick="sidecarRemove()"
                    data-sidecars="{{ t.tools.remove_sidecars }}"
                    data-immich="{{ t.tools.remove_immich }}"
                    data-both="{{ t.tools.remove_both }}"
                    data-confirm-sidecars="{{ t.tools.confirm_sidecars }}"
                    data-confirm-immich="{{ t.tools.confirm_immich }}"
                    data-confirm-both="{{ t.tools.confirm_both }}">{{ t.tools.remove_sidecars }}</button>
            <button type="button" class="btn btn-small btn-secondary" id="btn_cancel" style="display: none;" onclick="sidecarCancel()">{{ t.tools.cancel }}</button>
            <span id="sidecar_state" class="test-result"></span>
        </div>

        <div id="sidecar_result" style="margin-top: 1rem;"></div>
    </div>
</div>

<script>
var LAST_SCAN_PATTERN = null;

function sidecarScope() {
    return {
        sidecars: document.getElementById('do_sidecars').checked,
        immich: document.getElementById('do_immich').checked
    };
}
function sidecarLabel() {
    // The button says what it will actually touch — "Aus Sidecars entfernen"
    // on an Immich-only run was the single most confusing thing here.
    var sc = sidecarScope();
    var btn = document.getElementById('btn_remove');
    var key = sc.sidecars && sc.immich ? 'both' : (sc.immich ? 'immich' : 'sidecars');
    btn.textContent = btn.dataset[key];
    btn.dataset.activeConfirm = btn.dataset['confirm' + key.charAt(0).toUpperCase() + key.slice(1)];
}
function sidecarSubSwitch() {
    // The sub-switch only means anything with Immich on; greying it out is
    // clearer than silently ignoring it.
    var on = document.getElementById('do_immich').checked;
    var box = document.getElementById('do_per_asset');
    box.disabled = !on;
    if (!on) { box.checked = false; }
    document.getElementById('per_asset_row').style.opacity = on ? '' : '0.45';

    // Deleting the emptied tag only applies to the per-asset path.
    var sub = document.getElementById('do_also_delete');
    sub.disabled = !box.checked;
    if (!box.checked) { sub.checked = false; }
    document.getElementById('also_delete_row').style.opacity = box.checked ? '' : '0.45';
}
function sidecarInvalidate() {
    sidecarSubSwitch();
    sidecarLabel();
    // Any edit voids the preview — the server refuses a removal whose pattern
    // does not match the previewed one, this just keeps the UI honest.
    document.getElementById('btn_remove').disabled = true;
    document.getElementById('sidecar_result').innerHTML = '';
    LAST_SCAN_PATTERN = null;
}
function sidecarPreset(p) {
    document.getElementById('tag_pattern').value = p;
    sidecarInvalidate();
}

function sidecarRun(mode) {
    var pattern = document.getElementById('tag_pattern').value;
    var state = document.getElementById('sidecar_state');
    var body = new URLSearchParams();
    body.append('pattern', pattern);
    if (document.getElementById('do_sidecars').checked) { body.append('sidecars', '1'); }
    if (document.getElementById('do_immich').checked) { body.append('immich', '1'); }
    if (document.getElementById('do_per_asset').checked) { body.append('per_asset', '1'); }
    if (document.getElementById('do_also_delete').checked) { body.append('also_delete', '1'); }
    state.textContent = '{{ t.tools.running }}';
    state.style.color = '';
    sidecarBusy(true);
    fetch('/tools/tags/' + mode, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: body
    }).then(function (r) { return r.json(); })
      .then(function (d) {
          if (!d.ok) { sidecarFail(d.detail); return; }
          pollSidecar();
      }).catch(function (e) { sidecarFail(String(e)); });
}

function sidecarRemove() {
    if (!confirm(document.getElementById('btn_remove').dataset.activeConfirm)) { return; }
    sidecarRun('remove');
}
function sidecarRestore(res) {
    // Put the switches back the way the preview was taken, so the remove
    // button refers to exactly that run — the server would refuse otherwise.
    document.getElementById('tag_pattern').value = res.pattern || '';
    document.getElementById('do_sidecars').checked = !!res.sidecars_enabled;
    document.getElementById('do_immich').checked = !!(res.immich && res.immich.enabled);
    document.getElementById('do_per_asset').checked = !!(res.immich && res.immich.per_asset);
    document.getElementById('do_also_delete').checked = !!res.immich_also_delete;
    sidecarSubSwitch();
    sidecarLabel();
}
function sidecarResume() {
    // A run keeps going when the page is closed. On return, pick it back up
    // instead of leaving the user with "a task is already running".
    fetch('/api/jobs/cleanup-status').then(function (r) { return r.json(); })
        .then(function (p) {
            if (p.running) {
                sidecarBusy(true);
                if (p.task === 'sidecar_tags') {
                    pollSidecar();
                } else {
                    document.getElementById('sidecar_state').textContent = '{{ t.tools.other_task }}';
                }
                return;
            }
            if (p.task === 'sidecar_tags' && p.result) {
                if (p.result.mode === 'scan') { sidecarRestore(p.result); }
                renderSidecar(p.result);
            }
        }).catch(function () { /* Anzeige bleibt wie sie ist */ });
}
document.addEventListener('DOMContentLoaded', function () {
    sidecarSubSwitch();
    sidecarLabel();
    sidecarResume();
});

function sidecarCancel() {
    document.getElementById('btn_cancel').disabled = true;
    fetch('/tools/tags/cancel', {method: 'POST'});
}
function sidecarBusy(on) {
    document.getElementById('btn_scan').disabled = on;
    document.getElementById('btn_remove').disabled = on || !LAST_SCAN_PATTERN;
    var c = document.getElementById('btn_cancel');
    c.style.display = on ? '' : 'none';
    c.disabled = false;
}
function sidecarFail(msg) {
    var state = document.getElementById('sidecar_state');
    state.textContent = msg;
    state.style.color = 'var(--error)';
    sidecarBusy(false);
}

function pollSidecar() {
    fetch('/api/jobs/cleanup-status').then(function (r) { return r.json(); })
      .then(function (p) {
          var state = document.getElementById('sidecar_state');
          if (p.running) {
              var n = p.total ? ' (' + p.current + '/' + p.total + ')' : '';
              state.textContent = (p.phase || '') + n;
              setTimeout(pollSidecar, 1000);
              return;
          }
          sidecarBusy(false);
          if (p.error) { sidecarFail(p.error); return; }
          state.textContent = '';
          renderSidecar(p.result);
      }).catch(function (e) { sidecarFail(String(e)); });
}

function renderImmichPreview(im) {
    if (!im || !im.enabled) { return '<p class="section-note">{{ t.tools.immich_off }}</p>'; }
    if (!im.available) {
        return '<p class="section-note" style="color: var(--error);">{{ t.tools.immich_unavailable }} ' + im.error + '</p>';
    }
    var h = '<p><strong>' + im.tags.length + '</strong> {{ t.tools.of }} ' + im.total +
            ' {{ t.tools.immich_matched }}</p>';
    if (im.tags.length) {
        h += '<p class="section-note">' + im.tags.map(function (t) {
            // t.assets is the exact count from Immich's search total.
            return '<code>' + t.name + '</code>' +
                   (typeof t.assets === 'number' ? ' <small>(' + t.assets + ')</small>' : '');
        }).join(' ') + '</p>';
        if (im.per_asset) {
            var total = im.tags.reduce(function (n, t) {
                return n + (typeof t.assets === 'number' ? t.assets : 0);
            }, 0);
            h += '<p class="section-note">' + '{{ t.tools.per_asset_total }}'.replace('{n}', total) + '</p>';
        }
    }
    if (im.collateral.length) {
        h += '<p class="section-note" style="color: var(--error);">{{ t.tools.cascade_warning }}<br>' +
             im.collateral.map(function (n) { return '<code>' + n + '</code>'; }).join(' ') + '</p>';
    }
    return h;
}
function renderSidecar(res) {
    var box = document.getElementById('sidecar_result');
    if (!res) { box.innerHTML = ''; return; }
    var h = res.cancelled
        ? '<p class="section-note" style="color: var(--error);">{{ t.tools.cancelled }}</p>' : '';
    if (res.mode === 'scan') {
        h += res.sidecars_enabled
            ? '<p><strong>' + res.sidecars_matched + '</strong> {{ t.tools.of }} ' +
              res.sidecars_total + ' {{ t.tools.sidecars_scanned }}</p>'
            : '<p class="section-note">{{ t.tools.sidecars_off }}</p>';
        h += renderImmichPreview(res.immich);
        if (res.tags.length || (res.immich && res.immich.tags.length)) {
            if (res.tags.length) {
                h += '<table class="data-table"><thead><tr><th>{{ t.tools.tag }}</th><th>{{ t.tools.count }}</th></tr></thead><tbody>';
                res.tags.forEach(function (t) {
                    h += '<tr><td><code>' + t[0] + '</code></td><td>' + t[1] + '</td></tr>';
                });
                h += '</tbody></table>';
                h += '<p class="section-note">{{ t.tools.sample }}<br>' +
                     res.sample.map(function (f) { return '<code>' + f + '</code>'; }).join('<br>') + '</p>';
            }
            h += '<p class="section-note" style="color: var(--success);">{{ t.tools.preview_note }}</p>';
            document.getElementById('btn_remove').disabled = false;
            LAST_SCAN_PATTERN = res.pattern;
        } else {
            h += '<p class="section-note">{{ t.tools.no_match }}</p>';
        }
    } else {
        h += res.sidecars_enabled
            ? '<p><strong>' + res.sidecars_changed + '</strong> {{ t.tools.sidecars_changed }}, ' +
              res.tags_removed + ' {{ t.tools.tags_removed }}'
            : '<p class="section-note">{{ t.tools.sidecars_off }}';
        if (res.sidecars_failed) { h += ' — ' + res.sidecars_failed + ' {{ t.tools.failed }}'; }
        h += '</p>';
        h += '<p><strong>' + (res.immich_deleted || 0) + '</strong> ' +
             (res.immich_per_asset ? '{{ t.tools.immich_untagged }}' : '{{ t.tools.immich_deleted }}');
        if (res.immich_per_asset && res.immich_tags_deleted) {
            h += ', ' + res.immich_tags_deleted + ' {{ t.tools.immich_deleted }}';
        }

        if (res.immich_failed) { h += ' — ' + res.immich_failed + ' {{ t.tools.failed }}'; }
        h += '</p>';
        if (res.immich_error) {
            h += '<p class="section-note" style="color: var(--error);">' + res.immich_error + '</p>';
        }
    }
    box.innerHTML = h;
}
</script>
{% endblock %}
